<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commission Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d2e; --surface2: #252840; --surface3: #2e3355;
      --border: #2e3150; --border2: #3a3f6e;
      --text: #e8eaf6; --text-muted: #8b90b8; --text-dim: #5a6090;
      --accent: #6c63ff; --accent-light: #8b85ff; --accent-dim: #3d3880;
      --green: #4ade80; --green-dim: #1a3d2b;
      --red: #f87171; --red-dim: #3d1a1a;
      --yellow: #fbbf24; --yellow-dim: #3d3010;
      --blue: #60a5fa; --blue-dim: #1a2a3d;
      --purple: #c084fc;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .app { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }

    /* ── Header ── */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header h1 span { color: var(--accent-light); }
    .header-meta { font-size: 0.78rem; color: var(--text-muted); }

    /* ── Summary strip ── */
    .summary { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; min-width: 140px; }
    .stat .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .stat .value { font-size: 1.4rem; font-weight: 700; }
    .stat .value.green { color: var(--green); }
    .stat .value.red   { color: var(--red); }
    .stat .value.yellow{ color: var(--yellow); }

    /* ── Alert banner ── */
    .alert { display: flex; align-items: center; gap: 10px; background: var(--red-dim); border: 1px solid var(--red); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; color: var(--red); }

    /* ── Vendor grid ── */
    .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-bottom: 32px; }

    .vendor-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .vendor-card.has-discrepancy { border-color: var(--red); }
    .vendor-card.gmail-managed { border-color: var(--accent-dim); }

    .vc-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
    .vc-name { font-size: 0.95rem; font-weight: 700; letter-spacing: .01em; }
    .vc-badge { font-size: 0.7rem; font-weight: 600; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
    .vc-badge.matched      { background: var(--green-dim);  color: var(--green); }
    .vc-badge.discrepancy  { background: var(--red-dim);    color: var(--red); }
    .vc-badge.unable       { background: var(--yellow-dim); color: var(--yellow); }
    .vc-badge.login-req    { background: var(--surface3);   color: var(--text-muted); }
    .vc-badge.gmail        { background: var(--accent-dim); color: var(--accent-light); }
    .vc-badge.running      { background: var(--blue-dim);   color: var(--blue); }

    .vc-body { padding: 14px 16px; flex: 1; }
    .vc-row  { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 0.85rem; }
    .vc-row .lbl { color: var(--text-muted); }
    .vc-row .val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .vc-row .val.green { color: var(--green); }
    .vc-row .val.red   { color: var(--red); }
    .vc-row .val.muted { color: var(--text-muted); }
    .vc-row .val.yellow { color: var(--yellow); }
    .vc-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .vc-reason { font-size: 0.75rem; color: var(--yellow); background: var(--yellow-dim); border-radius: 6px; padding: 6px 10px; margin-top: 6px; line-height: 1.4; }
    .vc-error  { font-size: 0.75rem; color: var(--text-muted); background: var(--surface2); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
    .vc-last-check { font-size: 0.72rem; color: var(--text-dim); margin-top: 8px; }

    .vc-footer { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 8px; border: 1px solid; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all .15s; white-space: nowrap; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent-light); }
    .btn-secondary{ background: transparent; border-color: var(--border2); color: var(--text-muted); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-light); }
    .btn-danger   { background: transparent; border-color: var(--red); color: var(--red); }
    .btn-danger:hover:not(:disabled) { background: var(--red-dim); }
    .btn-sm { padding: 5px 10px; font-size: 0.76rem; }

    /* ── Session indicator ── */
    .session-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .session-dot.ok    { background: var(--green); }
    .session-dot.stale { background: var(--yellow); }
    .session-dot.none  { background: var(--text-dim); }

    /* ── Login modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 28px; max-width: 460px; width: 90%; }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
    .modal p  { font-size: 0.87rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
    .modal .url { font-size: 0.8rem; background: var(--surface2); border-radius: 6px; padding: 8px 12px; color: var(--blue); word-break: break-all; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ── History section ── */
    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .history-table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .history-table table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .history-table th { background: var(--surface2); color: var(--text-muted); padding: 9px 14px; text-align: left; font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; }
    .history-table td { padding: 9px 14px; border-top: 1px solid var(--border); }
    .history-table tr:hover td { background: var(--surface2); }
    .status-pill { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .status-pill.matched     { background: var(--green-dim);  color: var(--green); }
    .status-pill.discrepancy { background: var(--red-dim);    color: var(--red); }
    .status-pill.unable_to_verify { background: var(--yellow-dim); color: var(--yellow); }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent-light); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }

    /* ── Offline banner ── */
    .offline-banner { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 16px; font-size: 0.83rem; color: var(--text-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useCallback } = React;

  const SB_URL = 'https://ygotkwhvydmisrkyofec.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnb3Rrd2h2eWRtaXNya3lvZmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NDcyNDMsImV4cCI6MjA5OTEyMzI0M30.Ya5cYDBgof2yyT78TIQj20VWndLn1qTyaWXe36Dwchg';
  const LOCAL   = 'http://localhost:3001';
  const SB_HEAD = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` };
  const SYNC_URL = 'https://script.google.com/a/macros/cymate.io/s/AKfycbxNw8uKZB8DYJdN9W8Gy7-WtDMaZUto-i78zOpyuK_WiPpRNPxqm3MSViDZRtwegoDU/exec';

  const VENDORS = [
    { id: 'zapmail',   name: 'Zapmail',   platform: 'Custom Portal',  gmailManaged: false },
    { id: 'heyreach',  name: 'HeyReach',  platform: 'Tolt',           gmailManaged: false },
    { id: 'inboxkit',  name: 'Inboxkit',  platform: 'Direct',         gmailManaged: false },
    { id: 'smartlead', name: 'Smartlead', platform: 'Gmail Managed',  gmailManaged: true  },
    { id: 'icypeas',   name: 'Icypeas',   platform: 'FirstPromoter',  gmailManaged: false },
    { id: 'leadmagic', name: 'LeadMagic', platform: 'Dub.co',         gmailManaged: false },
  ];
  const VENDOR_COLORS = {
    zapmail: '#818cf8', heyreach: '#f472b6', inboxkit: '#38bdf8',
    smartlead: '#34d399', icypeas: '#fb923c', leadmagic: '#a78bfa',
  };

  const fmt = v => v == null ? '—' : `$${parseFloat(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const fmtDate = s => s ? new Date(s).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';

  // ── VendorCard ──────────────────────────────────────────────────────────────
  function VendorCard({ vendor, commissions, session, lastCheck, running, loginOpen, onRun, onLogin, onSaveSession, onSyncGmail }) {
    const color = VENDOR_COLORS[vendor.id] || '#8b85ff';

    // Pick the latest 2026 commission row for this vendor
    const rows2026 = commissions
      .filter(r => r.vendor === vendor.id && r.month >= '2026-01')
      .sort((a, b) => b.month.localeCompare(a.month));
    const latest = rows2026[0] || null;

    // Compute display status
    let badge = 'login-req', badgeText = 'Login Required';
    let hasDiscrepancy = false;
    if (vendor.gmailManaged) {
      badge = 'gmail'; badgeText = 'Gmail Managed';
    } else if (running) {
      badge = 'running'; badgeText = 'Checking…';
    } else if (lastCheck) {
      badge = lastCheck.status;
      badgeText = lastCheck.status === 'matched' ? 'Matched'
        : lastCheck.status === 'discrepancy' ? 'Discrepancy'
        : 'Unable to Verify';
      if (lastCheck.status === 'discrepancy') hasDiscrepancy = true;
    } else if (latest) {
      if (latest.expected != null && latest.received != null) {
        const diff = Math.abs(parseFloat(latest.expected) - parseFloat(latest.received));
        if (diff <= 0.01) { badge = 'matched'; badgeText = 'Matched'; }
        else { badge = 'discrepancy'; badgeText = 'Discrepancy'; hasDiscrepancy = true; }
      } else if (session?.exists) {
        badge = 'unable'; badgeText = 'Not Checked';
      }
    }

    const sessionOk = session?.exists && !session?.stale;
    const sessionStale = session?.exists && session?.stale;
    const needsLogin = !vendor.gmailManaged && !session?.exists;

    return (
      <div className={`vendor-card ${hasDiscrepancy ? 'has-discrepancy' : ''} ${vendor.gmailManaged ? 'gmail-managed' : ''}`}>
        <div className="vc-header">
          <span className="vc-name" style={{ color }}>{vendor.name}</span>
          <span className={`vc-badge ${badge}`}>
            {running && <span className="spinner" style={{ width: 10, height: 10, marginRight: 4 }} />}
            {badgeText}
          </span>
        </div>

        <div className="vc-body">
          {/* Session status */}
          {!vendor.gmailManaged && (
            <div className="vc-row" style={{ marginBottom: 10 }}>
              <span className="lbl">Session</span>
              <span className="val">
                <span className={`session-dot ${sessionOk ? 'ok' : sessionStale ? 'stale' : 'none'}`} />
                {sessionOk ? `Active (${session.age_days}d old)` : sessionStale ? `Stale (${session.age_days}d)` : 'Not saved'}
              </span>
            </div>
          )}

          {latest && <>
            <div className="vc-row">
              <span className="lbl">Period</span>
              <span className="val">{latest.month}</span>
            </div>
            <div className="vc-row">
              <span className="lbl">Dashboard (expected)</span>
              <span className="val">{fmt(latest.expected)}</span>
            </div>
            <div className="vc-row">
              <span className="lbl">Received (Gmail)</span>
              <span className={`val ${latest.received == null ? 'muted' : ''}`}>
                {latest.received == null ? 'Pending' : fmt(latest.received)}
              </span>
            </div>
            {latest.expected != null && latest.received != null && (
              <>
                <hr className="vc-divider" />
                <div className="vc-row">
                  <span className="lbl">Difference</span>
                  {(() => {
                    const diff = parseFloat(latest.received) - parseFloat(latest.expected);
                    return <span className={`val ${Math.abs(diff) <= 0.01 ? 'green' : 'red'}`}>
                      {Math.abs(diff) <= 0.01 ? '✓ Match' : `${diff >= 0 ? '+' : ''}${fmt(diff)}`}
                    </span>;
                  })()}
                </div>
              </>
            )}
          </>}

          {vendor.gmailManaged && !latest && (
            <div className="vc-row"><span className="lbl" style={{ color: 'var(--text-muted)' }}>Managed via Gmail receipt sync. Run Gmail Sync to update.</span></div>
          )}

          {lastCheck?.reason && (
            <div className={lastCheck.status === 'discrepancy' ? 'vc-reason' : 'vc-error'}>
              {lastCheck.reason}
            </div>
          )}

          {!vendor.gmailManaged && lastCheck && (
            <div className="vc-last-check">Last checked: {fmtDate(lastCheck.checked_at)}</div>
          )}
        </div>

        <div className="vc-footer">
          {vendor.gmailManaged ? (
            <button className="btn btn-secondary" onClick={onSyncGmail}>
              📧 Sync Gmail
            </button>
          ) : (<>
            {!sessionOk && !loginOpen && (
              <button className="btn btn-secondary" onClick={onLogin} disabled={running}>
                🔑 {needsLogin ? 'Login' : 'Re-Login'}
              </button>
            )}
            {loginOpen && (
              <button className="btn btn-primary" onClick={onSaveSession}>
                💾 Save Session
              </button>
            )}
            <button className="btn btn-primary" onClick={onRun}
              disabled={running || loginOpen || (!sessionOk && !sessionStale)}>
              {running ? <><span className="spinner" /> Checking…</> : '▶ Run Now'}
            </button>
            {sessionStale && !sessionOk && !loginOpen && (
              <span style={{ fontSize: '0.72rem', color: 'var(--yellow)', alignSelf: 'center' }}>Session may be expired</span>
            )}
          </>)}
        </div>
      </div>
    );
  }

  // ── LoginModal ──────────────────────────────────────────────────────────────
  function LoginModal({ vendor, loginUrl, onSave, onCancel }) {
    return (
      <div className="modal-overlay">
        <div className="modal">
          <h2>🔑 Log in to {vendor.name}</h2>
          <p>
            A Chrome browser window has opened. Complete the login — including any
            verification codes or MFA — then click <strong>Save Session</strong> below.
          </p>
          <div className="url">{loginUrl}</div>
          <p style={{ fontSize: '0.78rem', color: 'var(--text-dim)' }}>
            Do not close the Chrome window until you click Save Session.
          </p>
          <div className="modal-actions">
            <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
            <button className="btn btn-primary" onClick={onSave}>💾 Save Session</button>
          </div>
        </div>
      </div>
    );
  }

  // ── RunResultModal ──────────────────────────────────────────────────────────
  function RunResultModal({ vendor, result, onClose }) {
    const rows = result?.results?.[vendor.id]?.rows || [];
    const error = result?.results?.[vendor.id]?.error;
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>
          <h2>{vendor.name} — Check Result</h2>
          {error && <div className="vc-error" style={{ marginBottom: 12 }}>{error}</div>}
          {rows.length > 0 ? (
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.83rem', marginBottom: 16 }}>
              <thead>
                <tr style={{ color: 'var(--text-muted)', borderBottom: '1px solid var(--border)' }}>
                  <th style={{ padding: '6px 8px', textAlign: 'left' }}>Period</th>
                  <th style={{ padding: '6px 8px', textAlign: 'right' }}>Dashboard</th>
                  <th style={{ padding: '6px 8px', textAlign: 'right' }}>Received</th>
                  <th style={{ padding: '6px 8px', textAlign: 'right' }}>Status</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.period} style={{ borderBottom: '1px solid var(--border)' }}>
                    <td style={{ padding: '6px 8px' }}>{r.period}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'right' }}>{fmt(r.dashboard_amount)}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'right' }}>{r.received_amount == null ? '—' : fmt(r.received_amount)}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'right' }}>
                      <span className={`status-pill ${r.status}`}>
                        {r.status === 'matched' ? '✓ Matched' : r.status === 'discrepancy' ? '⚠ Discrepancy' : 'Unable to Verify'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          ) : (
            <p>No data returned.</p>
          )}
          <div className="modal-actions">
            <button className="btn btn-primary" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    );
  }

  // ── App ─────────────────────────────────────────────────────────────────────
  function App() {
    const [commissions,   setCommissions] = useState([]);
    const [checks,        setChecks]      = useState([]);
    const [sessions,      setSessions]    = useState({});
    const [localOnline,   setLocalOnline] = useState(null);
    const [running,       setRunning]     = useState(null);   // vendor id or null
    const [loginVendor,   setLoginVendor] = useState(null);   // vendor id with open browser
    const [loginUrl,      setLoginUrl]    = useState('');
    const [runResult,     setRunResult]   = useState(null);   // {vendor, result}
    const [gmailLoading,  setGmailLoading]= useState(false);

    const sbFetch = useCallback(async (path) => {
      const r = await fetch(`${SB_URL}${path}`, { headers: SB_HEAD });
      return r.ok ? r.json() : [];
    }, []);

    const loadAll = useCallback(async () => {
      const [comm, chk] = await Promise.all([
        sbFetch('/rest/v1/commissions?select=vendor,month,expected,received&order=month.desc&limit=200'),
        sbFetch('/rest/v1/commission_checks?select=vendor,period,dashboard_amount,received_amount,difference,status,reason,checked_at&order=checked_at.desc&limit=100'),
      ]);
      setCommissions(comm);
      setChecks(chk);
    }, [sbFetch]);

    const loadSessions = useCallback(async () => {
      try {
        const r = await fetch(`${LOCAL}/session`);
        if (r.ok) setSessions(await r.json());
      } catch (_) {}
    }, []);

    const checkLocal = useCallback(async () => {
      try {
        const r = await fetch(`${LOCAL}/ping`);
        setLocalOnline(r.ok);
        if (r.ok) loadSessions();
      } catch (_) {
        setLocalOnline(false);
      }
    }, [loadSessions]);

    useEffect(() => {
      loadAll();
      checkLocal();
    }, [loadAll, checkLocal]);

    // Latest check per vendor
    const lastCheckByVendor = {};
    checks.forEach(c => {
      if (!lastCheckByVendor[c.vendor]) lastCheckByVendor[c.vendor] = c;
    });

    // Summary stats
    const allVendorIds = VENDORS.map(v => v.id);
    const totals = allVendorIds.reduce((acc, vid) => {
      commissions.filter(r => r.vendor === vid && r.month >= '2026-01').forEach(r => {
        const latest = commissions.filter(c => c.vendor === vid && c.month >= '2026-01')
          .sort((a, b) => b.month.localeCompare(a.month))[0];
        if (latest && r === latest) {
          acc.expected += parseFloat(r.expected || 0);
          acc.received += parseFloat(r.received || 0);
        }
      });
      return acc;
    }, { expected: 0, received: 0 });
    const discrepancies = VENDORS.filter(v => {
      const lc = lastCheckByVendor[v.id];
      return lc?.status === 'discrepancy';
    });

    const handleRun = async (vendor) => {
      if (!localOnline) return alert('Local scraper is not running. Start it with: python3 local_api.py');
      setRunning(vendor.id);
      try {
        const r = await fetch(`${LOCAL}/run/${vendor.id}`, { method: 'POST' });
        const data = await r.json();
        setRunResult({ vendor, result: data });
        await loadAll();
        await loadSessions();
      } catch (e) {
        alert(`Error: ${e.message}`);
      } finally {
        setRunning(null);
      }
    };

    const handleLogin = async (vendor) => {
      if (!localOnline) return alert('Local scraper is not running. Start it with: python3 local_api.py');
      try {
        const r = await fetch(`${LOCAL}/login/${vendor.id}`, { method: 'POST' });
        const data = await r.json();
        if (!data.ok) return alert(`Could not open browser: ${data.error}`);
        setLoginVendor(vendor.id);
        setLoginUrl(data.url);
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
    };

    const handleSaveSession = async () => {
      try {
        const r = await fetch(`${LOCAL}/login/${loginVendor}/save`, { method: 'POST' });
        const data = await r.json();
        if (!data.ok) return alert(`Could not save session: ${data.error}`);
        setLoginVendor(null);
        setLoginUrl('');
        await loadSessions();
        alert(`Session saved for ${loginVendor}. You can now click Run Now.`);
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
    };

    const handleCancelLogin = async () => {
      setLoginVendor(null);
      setLoginUrl('');
    };

    const handleSyncGmail = () => {
      setGmailLoading(true);
      window.open(SYNC_URL, '_blank');
      setTimeout(async () => {
        await loadAll();
        setGmailLoading(false);
      }, 8000);
    };

    return (
      <div className="app">
        {/* Header */}
        <div className="header">
          <h1>Commission <span>Tracker</span></h1>
          <div className="header-meta">
            {localOnline === false && <span style={{ color: 'var(--yellow)' }}>⚠ Local scraper offline</span>}
            {localOnline === true  && <span style={{ color: 'var(--green)' }}>● Scraper online</span>}
          </div>
        </div>

        {/* Offline banner */}
        {localOnline === false && (
          <div className="offline-banner">
            ⚠️ The local scraper is not running. Start it to enable Run Now and Login buttons:
            <code style={{ background: 'var(--surface3)', padding: '2px 8px', borderRadius: 4, marginLeft: 4 }}>
              python3 /path/to/commission-tracker/local_api.py
            </code>
          </div>
        )}

        {/* Discrepancy alert */}
        {discrepancies.length > 0 && (
          <div className="alert">
            ⚠️ <strong>{discrepancies.length} discrepanc{discrepancies.length === 1 ? 'y' : 'ies'} found:</strong>{' '}
            {discrepancies.map(v => v.name).join(', ')}
          </div>
        )}

        {/* Summary */}
        <div className="summary">
          <div className="stat">
            <div className="label">Latest Expected</div>
            <div className="value">{fmt(totals.expected)}</div>
          </div>
          <div className="stat">
            <div className="label">Latest Received</div>
            <div className="value green">{fmt(totals.received)}</div>
          </div>
          <div className="stat">
            <div className="label">Discrepancies</div>
            <div className={`value ${discrepancies.length > 0 ? 'red' : 'green'}`}>{discrepancies.length}</div>
          </div>
          <div className="stat">
            <div className="label">Vendors Checked</div>
            <div className="value">{Object.keys(lastCheckByVendor).length} / {VENDORS.length}</div>
          </div>
        </div>

        {/* Vendor grid */}
        <div className="vendor-grid">
          {VENDORS.map(vendor => (
            <VendorCard
              key={vendor.id}
              vendor={vendor}
              commissions={commissions}
              session={sessions[vendor.id]}
              lastCheck={lastCheckByVendor[vendor.id]}
              running={running === vendor.id}
              loginOpen={loginVendor === vendor.id}
              onRun={() => handleRun(vendor)}
              onLogin={() => handleLogin(vendor)}
              onSaveSession={handleSaveSession}
              onSyncGmail={handleSyncGmail}
            />
          ))}
        </div>

        {/* Check history */}
        {checks.length > 0 && (
          <div>
            <div className="section-title">Check History</div>
            <div className="history-table">
              <table>
                <thead>
                  <tr>
                    <th>Vendor</th>
                    <th>Period</th>
                    <th>Dashboard</th>
                    <th>Received</th>
                    <th>Difference</th>
                    <th>Status</th>
                    <th>Checked</th>
                  </tr>
                </thead>
                <tbody>
                  {checks.slice(0, 50).map((c, i) => {
                    const diff = c.difference;
                    return (
                      <tr key={i}>
                        <td style={{ color: VENDOR_COLORS[c.vendor] || 'var(--text)', fontWeight: 600 }}>
                          {c.vendor.charAt(0).toUpperCase() + c.vendor.slice(1)}
                        </td>
                        <td>{c.period}</td>
                        <td>{fmt(c.dashboard_amount)}</td>
                        <td>{c.received_amount == null ? <span style={{ color: 'var(--text-muted)' }}>—</span> : fmt(c.received_amount)}</td>
                        <td style={{ color: diff == null ? 'var(--text-muted)' : Math.abs(diff) <= 0.01 ? 'var(--green)' : 'var(--red)' }}>
                          {diff == null ? '—' : Math.abs(diff) <= 0.01 ? '✓' : `${diff >= 0 ? '+' : ''}${fmt(diff)}`}
                        </td>
                        <td><span className={`status-pill ${c.status}`}>{c.status?.replace('_', ' ')}</span></td>
                        <td style={{ color: 'var(--text-muted)' }}>{fmtDate(c.checked_at)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* Modals */}
        {loginVendor && (
          <LoginModal
            vendor={VENDORS.find(v => v.id === loginVendor)}
            loginUrl={loginUrl}
            onSave={handleSaveSession}
            onCancel={handleCancelLogin}
          />
        )}
        {runResult && (
          <RunResultModal
            vendor={runResult.vendor}
            result={runResult.result}
            onClose={() => setRunResult(null)}
          />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
